<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Golos Text', 'Segoe UI', system-ui, sans-serif; }
    a { color: #f0b34a; } a:hover { color: #ffd27d; }
    .brk { position: absolute; width: 10px; height: 10px; border: 2px solid #56607f; }
    .brk-tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .brk-tr { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
    .brk-bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
    .brk-br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  </style>
</helmet>
<div style="width: 375px; min-height: 812px; box-sizing: border-box; padding: 20px 16px 28px; background-color: #0b0d14; background-image: radial-gradient(120% 60% at 50% 0%, #1b2135 0%, #0b0d14 70%), repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 28px), repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 28px); color: #edf0f7;">

  <div style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 24px;">Профиль</div>

  <div style="position: relative; display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 18px 16px; background-image: linear-gradient(180deg, #1d2233 0%, #141825 100%); border: 1px solid #2f3752;">
    <span class="brk brk-tl"></span><span class="brk brk-tr"></span><span class="brk brk-bl"></span><span class="brk brk-br"></span>
    <div style="width: 58px; height: 58px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(150deg, #ffd27d 0%, #c8862a 100%); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 22px; color: #14100a;">5</div>
    <div style="flex-grow: 1;">
      <div style="font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 18px;">Владимир</div>
      <div style="margin-top: 4px; font-size: 12px; color: #98a0bb;">Уровень 5 · 1230 опыта всего</div>
      <div style="margin-top: 3px; font-size: 12px; color: #7d86a3;">В игре 24 дня</div>
    </div>
  </div>

  <div style="margin-top: 22px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #98a0bb;">Настройки</div>
  <div style="display: flex; flex-direction: column; margin-top: 10px; border: 1px solid #232a3e;">
    <sc-for list="{{settings}}" as="row" hint-placeholder-count="6">
      <button onClick="{{row.act}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 14px; text-align: left; background-color: #10131e; border: 0; border-bottom: 1px solid #1c2233; cursor: pointer;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7d86a3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{row.icon}}"></path></svg>
        <span style="flex-grow: 1; font-family: 'Golos Text', sans-serif; font-size: 14px; font-weight: 500; color: #edf0f7;">{{row.name}}</span>
        <span style="font-family: 'Golos Text', sans-serif; font-size: 13px; font-weight: 600; color: {{row.valueColor}};">{{row.value}}</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#465071" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </div>

  <div style="position: relative; margin-top: 22px; padding: 18px 16px; background-image: linear-gradient(180deg, #241d0e 0%, #141825 100%); border: 1px solid #6b5220;">
    <span class="brk brk-tl" style="border-color: #f0b34a;"></span><span class="brk brk-tr" style="border-color: #f0b34a;"></span><span class="brk brk-bl" style="border-color: #f0b34a;"></span><span class="brk brk-br" style="border-color: #f0b34a;"></span>
    <div style="font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #f0b34a;">Премиум</div>
    <div style="margin-top: 10px; font-family: 'Unbounded', sans-serif; font-weight: 500; font-size: 17px; line-height: 1.3;">Больше привычек, боссы и полная история</div>
    <div style="margin-top: 10px; font-size: 13px; line-height: 1.55; color: #b9c0d6;">Без рекламы и без игрового преимущества. Подписка не делает персонажа сильнее — только снимает ограничения.</div>
    <button onClick="{{noop}}" style="width: 100%; height: 48px; margin-top: 16px; background-color: #f0b34a; border: 0; color: #14100a; font-family: 'Golos Text', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer;">Оформить за 299 ₽ в месяц</button>
  </div>

  <button onClick="{{noop}}" style="width: 100%; min-height: 52px; margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 9px; background-color: transparent; border: 1px solid #5a3128; color: #f2705f; font-family: 'Golos Text', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f2705f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"></path></svg>
    Сбросить весь прогресс
  </button>
  <div style="margin-top: 8px; font-size: 11px; line-height: 1.5; text-align: center; color: #6f7a99;">Действие необратимо и спросит подтверждение</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'Тема', value: 'Тёмная', icon: 'M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z', accent: true },
      { name: 'Язык', value: 'Русский', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.4 2.5 15.6 0 18M12 3c-2.5 2.4-2.5 15.6 0 18' },
      { name: 'Напоминания', value: '09:00', icon: 'M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7M13.7 20a2 2 0 0 1-3.4 0' },
      { name: 'Смена суток', value: '04:00', icon: 'M12 7v5l3 2M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z' },
      { name: 'Экспорт данных', value: 'JSON', icon: 'M12 3v12M8 11l4 4 4-4M4 19h16' },
      { name: 'Импорт данных', value: '', icon: 'M12 15V3M8 7l4-4 4 4M4 19h16' }
    ];

    return {
      noop: () => {},
      settings: rows.map((row) => ({
        name: row.name,
        value: row.value,
        icon: row.icon,
        valueColor: row.accent ? '#f0b34a' : '#98a0bb',
        act: () => {}
      }))
    };
  }
}
</script>
</body>
</html>
