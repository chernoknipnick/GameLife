<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="GameLife — геймифицированный трекер привычек: реальные дела дают опыт персонажу." />
    <title>GameLife — Сегодня</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="hero">
        <div class="hero__top">
          <div class="hero__greeting">
            <p class="hero__hello">С возвращением</p>
            <p class="hero__name">Владимир</p>
          </div>

          <div class="hero__badges">
            <p class="pill pill--streak" title="Дней подряд в приложении">
              <svg class="icon" viewBox="0 0 10 12" aria-hidden="true">
                <path d="M5 .5C6.6 3 8.5 4 8.5 7A3.5 3.5 0 0 1 1.5 7c0-1.8 1.6-2.7 3.5-6.5z" fill="currentColor" />
              </svg>
              <span>12</span>
            </p>

            <p class="avatar">
              <span class="avatar__shape" aria-hidden="true"></span>
              <span class="avatar__level" id="level">5</span>
              <span class="visually-hidden">Уровень <span id="level-text">5</span></span>
            </p>
          </div>
        </div>

        <div class="xp">
          <div class="xp__labels">
            <span class="xp__caption">ОПЫТ</span>
            <span class="xp__value" id="xp-value">180 / 300</span>
          </div>
          <div
            class="xp__track"
            id="xp-track"
            role="progressbar"
            aria-label="Опыт до следующего уровня"
            aria-valuenow="180"
            aria-valuemin="0"
            aria-valuemax="300"
          >
            <div class="xp__fill" id="xp-fill" style="width: 60%"></div>
          </div>
        </div>
      </header>

      <section class="abilities" aria-label="Характеристики">
        <ul class="abilities__grid">
          <li class="ability ability--strength">
            <span class="ability__abbr">СИЛ</span>
            <span class="ability__value" id="stat-strength">145</span>
            <span class="visually-hidden">Сила</span>
          </li>
          <li class="ability ability--intellect">
            <span class="ability__abbr">ИНТ</span>
            <span class="ability__value" id="stat-intellect">320</span>
            <span class="visually-hidden">Интеллект</span>
          </li>
          <li class="ability ability--health">
            <span class="ability__abbr">ЗДР</span>
            <span class="ability__value" id="stat-health">90</span>
            <span class="visually-hidden">Здоровье</span>
          </li>
          <li class="ability ability--discipline">
            <span class="ability__abbr">ДИС</span>
            <span class="ability__value" id="stat-discipline">210</span>
            <span class="visually-hidden">Дисциплина — растёт сама с любого выполнения</span>
          </li>
        </ul>
      </section>

      <main class="today">
        <div class="today__head">
          <h1 class="today__title">Сегодня</h1>
          <p class="today__meta" id="today-meta">1 / 3</p>
        </div>

        <ul class="habits" id="habits"></ul>

        <button class="btn btn--add" type="button">Добавить привычку</button>

        <p class="limit">
          Дневной лимит опыта: <span class="limit__value" id="limit-value">13 / 500</span>
        </p>
      </main>

      <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

      <div class="modal" id="levelup" hidden>
        <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="levelup-title">
          <p class="modal__kicker">Новый уровень</p>
          <p class="modal__badge" id="levelup-badge">6</p>
          <h2 class="modal__title" id="levelup-title">Уровень 6</h2>
          <p class="modal__text" id="levelup-text"></p>
          <button class="btn btn--done btn--modal" id="levelup-close" type="button">Отлично</button>
        </div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
