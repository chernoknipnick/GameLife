# Автоматические проверки для пул-реквестов.
#
# До v0.3 проверять было почти нечего: чистые HTML, CSS и JS без сборки,
# поэтому смотрели синтаксис скрипта, формат и корректность разметки.
#
# С переездом на React проверки стали настоящими. html-validate убран
# намеренно: index.html теперь пустая оболочка с одним div, вся разметка
# рождается в компонентах, и проверять шаблон бессмысленно.

name: Проверки

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Формат, тесты и сборка
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Правила формата лежат в .prettierrc и одинаковы локально и здесь.
      - name: Единый формат кода
        run: npx prettier --check "src/**/*.{js,jsx,css}" index.html vite.config.js

      - name: Тесты
        run: npm test

      # Сборка тоже проверка: сломанный импорт тесты пропустят, а сборка нет.
      - name: Сборка
        run: npm run build
